name: Build Litt GUI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  engine-sdk-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v4
        with:
          path: litt-gui

      - name: Checkout Litt Engine
        uses: actions/checkout@v4
        with:
          repository: korewa-dev/litt-engine
          ref: main
          path: litt-engine

      - name: Build tested Litt Engine SDK
        run: make -C litt-engine/alt/src/native sdk

      - name: Configure GUI bridge against packaged SDK
        run: >-
          cmake -S litt-gui -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLITT_SDK_ROOT=$GITHUB_WORKSPACE/litt-engine/alt/src/native/dist
          -DLITT_GUI_BUILD_APP=OFF

      - name: Build GUI bridge
        run: cmake --build build --target litt-gui-bridge --parallel
