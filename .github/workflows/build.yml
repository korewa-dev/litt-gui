name: Build Litt GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Vulkan SDK
      run: |
        wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
        sudo wget -qO /etc/apt/sources.list.d/vulkan.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
        sudo apt-get update -q
        sudo apt-get install -y vulkan-sdk
    
    - name: Install dependencies
      run: |
        sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev
    
    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      run: |
        cd build
        cmake --build . --parallel
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: litt-gui
        path: build/litt-gui
